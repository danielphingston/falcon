name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm test

      - name: Build
        env:
          # Google OAuth client ID. Not a secret: it ships in the page and only
          # works on the origins authorized in Google Cloud.
          VITE_GOOGLE_CLIENT_ID: 224682214152-kq1m926ij6ue1e5772pj68v1ule67gri.apps.googleusercontent.com
        run: |
          REPO="${{ github.event.repository.name }}"
          # Project sites live under /<repo>/; a <user>.github.io repo is served at /.
          if [[ "$REPO" == *.github.io ]]; then export BASE_PATH=/; else export BASE_PATH="/$REPO/"; fi
          npm run build
          # Deep links (e.g. /repo/engagements/123) fall back to the app.
          cp apps/web/dist/index.html apps/web/dist/404.html

      - uses: actions/upload-pages-artifact@v5
        with:
          path: apps/web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
